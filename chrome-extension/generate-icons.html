<!DOCTYPE html>
<html>
<head>
    <title>Generate Icons</title>
</head>
<body>
    <canvas id="canvas128" width="128" height="128"></canvas>
    <canvas id="canvas48" width="48" height="48"></canvas>
    <canvas id="canvas16" width="16" height="16"></canvas>
    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            
            // Rounded rectangle background
            const radius = size * 0.15;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw arrow/tab icon
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size * 0.08;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const centerX = size / 2;
            const centerY = size / 2;
            const arrowSize = size * 0.3;
            
            ctx.beginPath();
            ctx.moveTo(centerX - arrowSize, centerY);
            ctx.lineTo(centerX, centerY - arrowSize);
            ctx.lineTo(centerX + arrowSize, centerY);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - arrowSize + size * 0.05);
            ctx.lineTo(centerX, centerY + arrowSize + size * 0.1);
            ctx.stroke();
        }
        
        drawIcon(document.getElementById('canvas128'), 128);
        drawIcon(document.getElementById('canvas48'), 48);
        drawIcon(document.getElementById('canvas16'), 16);
        
        // Download icons
        ['canvas128', 'canvas48', 'canvas16'].forEach(id => {
            const canvas = document.getElementById(id);
            const size = id.replace('canvas', '');
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon${size}.png`;
                a.click();
            });
        });
    </script>
</body>
</html>
