<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
            height: 100%;
            width: 100%;
        }
    </style>
    <script>
        chrome.storage.sync.get(['customUrl'], (result) => {
            const customUrl = result.customUrl ? result.customUrl.trim() : '';
            if (customUrl) {
                const validPrefixes = ['https://', 'http://', 'file://', 'ftp://', 'urn:', 'chrome-extension://', 'chrome://'];
                if (validPrefixes.some(prefix => customUrl.startsWith(prefix))) {
                    window.location.replace(customUrl);
                }
            } else {
                window.location.replace('chrome://newtab');
            }
        });
    </script>
</head>
<body></body>
</html>
